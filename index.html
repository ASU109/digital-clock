<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="starfield"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">
                <span class="title-icon">🌍</span>
                <span>World Clock</span>
                <span class="title-icon">⏰</span>
            </h1>
            <p class="subtitle">Track time across the globe in real-time</p>
        </div>
        
        <div class="clock-grid" id="clockGrid">
            <!-- Clock cards will be generated by JavaScript -->
        </div>

        <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon">🕐</div>
            <h2>No Timezones Selected</h2>
            <p>Click "Add Timezone" to start tracking time around the world</p>
        </div>

        <div class="controls">
            <button id="addClockBtn" class="btn btn-add">
                <span class="btn-icon">+</span>
                <span>Add Timezone</span>
            </button>
            <button id="resetBtn" class="btn btn-reset">
                <span class="btn-icon">↻</span>
                <span>Reset</span>
            </button>
        </div>

        <div id="timezoneModal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Select a Timezone</h2>
                    <span class="close">&times;</span>
                </div>
                <input 
                    type="text" 
                    id="timezoneSearch" 
                    placeholder="🔍 Search by city or region..." 
                    class="search-input"
                >
                <div id="timezoneList" class="timezone-list">
                    <!-- Timezone options will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
